[project]
name = "rag-py"
version = "0.1.0"
description = "A complete RAG application: hybrid search, metadata filtering, reranking and corrective RAG - class demo code"
readme = "README.md"
authors = [
    { name = "Telusko" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-py = "rag_py:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
